    // QUIZ LOGIC

    let currentQuestions = [];
    let currentQuestion = 0;
    let score = 0;
    let selectedUnit = 0;


    function startQuiz(unitNumber) {

        selectedUnit = unitNumber;

        if (unitNumber === 1) {
            currentQuestions = unit1;
        }
        else if (unitNumber === 2) {
            currentQuestions = unit2;
        }
        else if (unitNumber === 3) {
            currentQuestions = unit3;
        }
        else if (unitNumber === 4) {
            currentQuestions = unit4;
        }
        else if (unitNumber === 5) {
            currentQuestions = unit5;
        }

        currentQuestion = 0;
        score = 0;

        document.getElementById("unitSelection").style.display = "none";
        document.getElementById("quizArea").style.display = "block";
        document.getElementById("resultArea").style.display = "none";

        document.getElementById("unitTitle").textContent =
            "Unit " + selectedUnit + " Quiz";

        showQuestion();
    }


    function showQuestion() {

        let question = currentQuestions[currentQuestion];

        document.getElementById("questionNumber").textContent =
            "Question " + (currentQuestion + 1) + " of 20";

        document.getElementById("questionText").textContent =
            question.question;

        let optionsHTML = "";

        for (let i = 0; i < question.options.length; i++) {

            optionsHTML += `
                <label class="option-label">
                    <input type="radio" name="answer" value="${i}">
                    ${String.fromCharCode(65 + i)}. ${question.options[i]}
                </label>
            `;
        }

        document.getElementById("options").innerHTML = optionsHTML;


        if (currentQuestion === currentQuestions.length - 1) {
            document.getElementById("nextBtn").textContent = "Submit Quiz ✓";
        }
        else {
            document.getElementById("nextBtn").textContent = "Next Question →";
        }
    }


    function nextQuestion() {

        let selectedAnswer = document.querySelector(
            'input[name="answer"]:checked'
        );


        if (!selectedAnswer) {
            alert("Please select an answer before continuing.");
            return;
        }


        let answer = Number(selectedAnswer.value);

        if (answer === currentQuestions[currentQuestion].answer) {
            score++;
        }


        currentQuestion++;


        if (currentQuestion < currentQuestions.length) {
            showQuestion();
        }
        else {
            showResult();
        }
    }


    function showResult() {

        document.getElementById("quizArea").style.display = "none";
        document.getElementById("resultArea").style.display = "block";

        document.getElementById("scoreText").textContent =
            "Your Score: " + score + " / 20";
    }


    function restartQuiz() {

        document.getElementById("resultArea").style.display = "none";
        document.getElementById("unitSelection").style.display = "flex";
    }
